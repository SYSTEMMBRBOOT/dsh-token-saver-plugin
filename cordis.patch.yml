# Token saver: trim oversized tool results, hide unused tool families, tighten
# the budget as the context fills up.
# Every value below is optional; the plugin falls back to its built-in defaults.
- insert:
    - id: dsh-token-saver
      name: dsh-token-saver-plugin
      config:
        # Clamp a single tool result to roughly this many tokens.
        maxResultTokens: 2000
        # Share of the remaining budget kept from the start of the output.
        headRatio: 0.6
        # Leave error results untouched so failures stay diagnosable.
        keepErrorResults: true
        # Optional per-tool budgets, e.g. tighten shell output below the global cap.
        # toolBudgets:
        #   pwsh: 1200
        #   grep: 600
        # Hide whole tool families so their JSON schemas stop riding along on every
        # request: browser (ego_*), office (office_*), schedules (schedule_*),
        # agents (subagent and friends). Exact names and `*` wildcards also work.
        # presets: []
        # hideTools: ['office_*']
        # Shrink the budget when the session is close to its context window and
        # relax it when the window is nearly empty.
        # adaptive:
        #   enabled: true
        #   highPressure: 0.7
        #   lowPressure: 0.3
        #   highFactor: 0.5
        #   lowFactor: 1.5
        # Replace inline images larger than this many KB with a text placeholder
        # (0 keeps every image).
        # dropImagesAboveKB: 0
